<svg viewBox="0 0 640 210" role="img" aria-label="J-cut and L-cut on a timeline"><text class="f-text" x="20" y="22" font-weight="600">J-cut: B's sound starts first</text><text class="f-mute" x="20" y="60">V</text><rect x="38" y="40" width="140" height="30" style="fill:var(--accent-soft);stroke:var(--accent)"/><rect x="178" y="40" width="130" height="30" style="fill:var(--mark-soft, #fbefd9);stroke:var(--mark)"/><text class="f-mute" x="108.0" y="59" text-anchor="middle">shot A</text><text class="f-mute" x="243.0" y="59" text-anchor="middle">shot B</text><text class="f-mute" x="20" y="100">A</text><rect x="38" y="80" width="90" height="30" style="fill:var(--accent-soft);stroke:var(--accent)"/><rect x="128" y="80" width="180" height="30" style="fill:var(--mark-soft, #fbefd9);stroke:var(--mark)"/><text class="f-mute" x="83.0" y="99" text-anchor="middle">shot A</text><text class="f-mute" x="218.0" y="99" text-anchor="middle">shot B</text><line x1="178" y1="32" x2="178" y2="120" style="stroke:var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="f-mute" x="178" y="134" text-anchor="middle">picture cut</text><text class="f-text" x="340" y="22" font-weight="600">L-cut: A's sound runs on</text><text class="f-mute" x="340" y="60">V</text><rect x="358" y="40" width="140" height="30" style="fill:var(--accent-soft);stroke:var(--accent)"/><rect x="498" y="40" width="130" height="30" style="fill:var(--mark-soft, #fbefd9);stroke:var(--mark)"/><text class="f-mute" x="428.0" y="59" text-anchor="middle">shot A</text><text class="f-mute" x="563.0" y="59" text-anchor="middle">shot B</text><text class="f-mute" x="340" y="100">A</text><rect x="358" y="80" width="200" height="30" style="fill:var(--accent-soft);stroke:var(--accent)"/><rect x="558" y="80" width="70" height="30" style="fill:var(--mark-soft, #fbefd9);stroke:var(--mark)"/><text class="f-mute" x="458.0" y="99" text-anchor="middle">shot A</text><text class="f-mute" x="593.0" y="99" text-anchor="middle">shot B</text><line x1="498" y1="32" x2="498" y2="120" style="stroke:var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="f-mute" x="498" y="134" text-anchor="middle">picture cut</text><text class="f-mute" x="20" y="170">The audio cut and the picture cut happen at different times.</text><text class="f-mute" x="20" y="188">The letter shows the shape of the audio edge on the timeline.</text></svg>