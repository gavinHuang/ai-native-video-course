<svg viewBox="0 0 520 300" role="img" aria-label="180-degree rule, top view"><text class="f-mute" x="16" y="22">TOP VIEW · ACTION LINE</text><line x1="60" y1="130" x2="460" y2="130" style="stroke:var(--mark)" stroke-width="2" stroke-dasharray="8 5"/><circle class="f-soft" cx="170" cy="130" r="20"/><text class="f-text" x="170" y="134" text-anchor="middle">A</text><circle class="f-soft" cx="350" cy="130" r="20"/><text class="f-text" x="350" y="134" text-anchor="middle">B</text><rect x="60" y="140" width="400" height="140" style="fill:var(--accent-soft);opacity:.55"/><text class="f-mute" x="72" y="272">ALLOWED SIDE: A stays left, B stays right</text><rect class="f-fill" x="244" y="230" width="32" height="20" style="stroke:var(--ink)"/><text class="f-mute" x="260" y="244" text-anchor="middle">1</text><rect class="f-fill" x="134" y="200" width="32" height="20" style="stroke:var(--ink)"/><text class="f-mute" x="150" y="214" text-anchor="middle">2</text><rect class="f-fill" x="364" y="200" width="32" height="20" style="stroke:var(--ink)"/><text class="f-mute" x="380" y="214" text-anchor="middle">3</text><rect class="f-fill" x="244" y="52" width="32" height="20" style="stroke:var(--bad)"/><text class="f-mute" x="260" y="66" text-anchor="middle">✕</text><text class="f-mute" x="290" y="66">crossing the line: A and B swap sides on screen</text></svg>