<svg viewBox="0 0 640 230" role="img" aria-label="Local and cloud generation paths"><text class="f-mute" x="20" y="22">LOCAL</text><rect class="f-fill" x="20" y="34" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="30" y="56">Workstation GPU (24–96 GB)</text><rect class="f-fill" x="20" y="78" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="30" y="100">NVMe: models + cache</text><rect class="f-fill" x="20" y="122" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="30" y="144">ComfyUI / scripts</text><text class="f-mute" x="230" y="22">SERVERLESS / RENTED</text><rect class="f-fill" x="230" y="34" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="240" y="56">Container with model</text><rect class="f-fill" x="230" y="78" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="240" y="100">Autoscale on queue</text><rect class="f-fill" x="230" y="122" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="240" y="144">Pay per GPU-second/hour</text><text class="f-mute" x="440" y="22">MODEL APIs</text><rect class="f-fill" x="440" y="34" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="450" y="56">Vendor or aggregator</text><rect class="f-fill" x="440" y="78" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="450" y="100">Pay per output second</text><rect class="f-fill" x="440" y="122" width="180" height="34" rx="5" style="stroke:var(--line)"/><text class="f-text" x="450" y="144">No ops, less control</text><rect class="f-soft" x="20" y="176" width="600" height="38" rx="6"/><text class="f-text" x="320" y="200" text-anchor="middle" font-weight="600">Your pipeline: one backend interface routes each shot to the best path</text></svg>