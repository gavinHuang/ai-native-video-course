<svg viewBox="0 0 640 150" role="img" aria-label="Color temperature scale"><defs><linearGradient id="ct-g" x1="0" x2="1"><stop offset="0" stop-color="#ff8a2a"/><stop offset="0.25" stop-color="#ffb46b"/><stop offset="0.45" stop-color="#ffd8a8"/><stop offset="0.66" stop-color="#fff6ec"/><stop offset="0.85" stop-color="#dfe9ff"/><stop offset="1" stop-color="#b9cdff"/></linearGradient></defs><rect x="30" y="40" width="580" height="26" rx="4" style="fill:url(#ct-g);stroke:var(--line)"/><line x1="40" y1="34" x2="40" y2="72" style="stroke:var(--ink)" stroke-width="1.2"/><text class="f-text" x="40" y="90" text-anchor="middle" font-weight="600">candle, fire</text><text class="f-mute" x="40" y="103" text-anchor="middle">1,900 K</text><line x1="172" y1="34" x2="172" y2="72" style="stroke:var(--ink)" stroke-width="1.2"/><text class="f-text" x="172" y="118" text-anchor="middle" font-weight="600">tungsten</text><text class="f-mute" x="172" y="131" text-anchor="middle">3,200 K</text><line x1="254" y1="34" x2="254" y2="72" style="stroke:var(--ink)" stroke-width="1.2"/><text class="f-text" x="254" y="90" text-anchor="middle" font-weight="600">golden hour</text><text class="f-mute" x="254" y="103" text-anchor="middle">4,000 K</text><line x1="417" y1="34" x2="417" y2="72" style="stroke:var(--ink)" stroke-width="1.2"/><text class="f-text" x="417" y="118" text-anchor="middle" font-weight="600">daylight</text><text class="f-mute" x="417" y="131" text-anchor="middle">5,600 K</text><line x1="559" y1="34" x2="559" y2="72" style="stroke:var(--ink)" stroke-width="1.2"/><text class="f-text" x="559" y="90" text-anchor="middle" font-weight="600">shade, overcast</text><text class="f-mute" x="559" y="103" text-anchor="middle">7,000 K</text><text class="f-mute" x="30" y="28">WARM</text><text class="f-mute" x="610" y="28" text-anchor="end">COOL</text></svg>