<svg viewBox="0 0 640 170" role="img" aria-label="Handles around a planned cut point"><rect x="80" y="30" width="240" height="30" style="fill:var(--accent-soft);stroke:var(--accent)"/><rect x="320" y="30" width="60" height="30" style="fill:var(--accent-soft);stroke:var(--accent);opacity:.5" stroke-dasharray="3 2"/><rect x="260" y="80" width="60" height="30" style="fill:var(--mark-soft, #fbefd9);stroke:var(--mark);opacity:.5" stroke-dasharray="3 2"/><rect x="320" y="80" width="240" height="30" style="fill:var(--mark-soft, #fbefd9);stroke:var(--mark)"/><text class="f-text" x="90" y="50">shot A (used)</text><text class="f-text" x="330" y="100">shot B (used)</text><text class="f-mute" x="350" y="49" text-anchor="middle">+1 s</text><text class="f-mute" x="290" y="99" text-anchor="middle">+1 s</text><line x1="320" y1="18" x2="320" y2="124" style="stroke:var(--ink)" stroke-width="1.5"/><text class="f-mute" x="320" y="140" text-anchor="middle">planned cut point</text><text class="f-mute" x="80" y="160">Dashed: handles. Generate them, so you can move the cut or add a transition.</text></svg>