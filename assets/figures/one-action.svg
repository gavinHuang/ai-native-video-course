<svg viewBox="0 0 640 170" role="img" aria-label="One shot, one action"><text class="f-text" x="20" y="22" font-weight="600">One 8 s clip, five actions</text><rect x="20" y="32" width="200" height="34" rx="3" style="fill:var(--bad);opacity:.15;stroke:var(--bad)"/><text class="f-mute" x="24" y="48" style="fill:var(--ink)">opens</text><text class="f-mute" x="64" y="60" style="fill:var(--ink)">walks</text><text class="f-mute" x="104" y="48" style="fill:var(--ink)">sees</text><text class="f-mute" x="144" y="60" style="fill:var(--ink)">picks</text><text class="f-mute" x="184" y="48" style="fill:var(--ink)">cries</text><path d="M229,44 L239,54 M239,44 L229,54" style="stroke:var(--bad);fill:none" stroke-width="2.2" stroke-linecap="round"/><text class="f-text" x="20" y="102" font-weight="600">Five shots, one action each</text><rect x="20" y="112" width="114" height="34" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/><text class="f-text" x="77" y="133" text-anchor="middle">opens door</text><rect x="142" y="112" width="114" height="34" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/><text class="f-text" x="199" y="133" text-anchor="middle">walks in</text><rect x="264" y="112" width="114" height="34" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/><text class="f-text" x="321" y="133" text-anchor="middle">sees letter</text><rect x="386" y="112" width="114" height="34" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/><text class="f-text" x="443" y="133" text-anchor="middle">picks it up</text><rect x="508" y="112" width="114" height="34" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/><text class="f-text" x="565" y="133" text-anchor="middle">cries</text><text class="f-mute" x="20" y="164">Each shot has a clear start state and end state.</text></svg>